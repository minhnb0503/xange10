            },
            {

            // === DỮ LIỆU CÁC TRẠM PVOIL ===
            {

                address: "Số 488 Đường Khương Đình, Phường Hạ Đình, Quận Thanh Xuân, Hà Nội",

            {

            },
            {

                address: "Số 358 Đường Nguyễn Khoái, Phường Thanh Lương, Quận Hai Bà Trưng, Hà Nội",
                lat: 21.002341, lng: 105.871234,
                fuels: ["E5 RON 92", "E10 RON 95-V", "DO 0,05S-II"]
            },
            {
                brand: "PVOIL",
                name: "CHXD PVOIL Đền Lừ",
                address: "Khu đô thị Đền Lừ, Phường Hoàng Văn Thụ, Quận Hoàng Mai, Hà Nội",
                lat: 20.991234, lng: 105.858765,
                fuels: ["E5 RON 92", "RON 95-III", "E10 RON 95-V"]
            }
        ];

        let userLat = null;
        let userLng = null;

        // Khởi tạo bản đồ lấy tâm tại Hà Nội, chuyển sang gói bản đồ nền Dark Matter cực chất của CartoDB
        const map = L.map('map').setView([21.028511, 105.804817], 12);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://carto.com/">CARTO</a>'
        }).addTo(map);

        const markerGroup = L.layerGroup().addTo(map);

        // Công thức tính khoảng cách hình học Haversine (km)
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = 
                Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c; 
        }

        // HÀM LỌC VÀ HIỂN THỊ CHÍNH XÁC
        function filterAndRenderStations() {
            markerGroup.clearLayers();

            const selectedDistrict = document.getElementById('select-district').value.toLowerCase();
            const searchKeyword = document.getElementById('search-keyword').value.toLowerCase().trim();

            // 1. THIẾT KẾ CÀI ĐẶT ICON CHO VỊ TRÍ CỦA BẠN (Sóng rada Cyan phát sáng)
            if (userLat && userLng) {
                const userIcon = L.divIcon({
                    className: 'user-marker-hightech',
                    html: `
                        <div class="relative flex h-5 w-5">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-cyan-400 opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-5 w-5 bg-cyan-500 border-2 border-slate-950 shadow-[0_0_10px_#22d3ee]"></span>
                        </div>
                    `,
                    iconSize: [20, 20],
                    iconAnchor: [10, 10]
                });
                L.marker([userLat, userLng], { icon: userIcon }).addTo(markerGroup).bindPopup("<b class='text-cyan-400 font-mono'>MỤC TIÊU ĐỊNH VỊ (VỊ TRÍ CỦA BẠN)</b>").openPopup();
            }

            // Tiến hành lọc trạm
            let filteredResults = hangXangHanoiData.filter(station => {
                const hasE10 = station.fuels.includes("E10 RON 95-V");
                
                const matchDistrict = !selectedDistrict || 
                                      station.address.toLowerCase().includes(selectedDistrict) || 
                                      station.name.toLowerCase().includes(selectedDistrict);
                
                const matchKeyword = !searchKeyword || 
                                     station.name.toLowerCase().includes(searchKeyword) || 
                                     station.address.toLowerCase().includes(searchKeyword) ||
                                     station.brand.toLowerCase().includes(searchKeyword);
                
                return hasE10 && matchDistrict && matchKeyword;
            });

            if (userLat && userLng) {
                filteredResults = filteredResults.map(station => {
                    return { ...station, distance: calculateDistance(userLat, userLng, station.lat, station.lng) };
                });
                filteredResults.sort((a, b) => a.distance - b.distance);
            }

            document.getElementById('result-count').innerText = `${filteredResults.length} trạm`;

            const listContainer = document.getElementById('station-list');
            listContainer.innerHTML = "";

            if (filteredResults.length === 0) {
                listContainer.innerHTML = '<p class="text-slate-500 text-center py-16 font-mono border border-dashed border-slate-800 rounded-lg">NO SIGNALS FOUND IN THIS SECTOR.</p>';
                return;
            }

            const viewBounds = [];
            if (userLat && userLng) viewBounds.push([userLat, userLng]);

            filteredResults.forEach((station, idx) => {
                viewBounds.push([station.lat, station.lng]);

                const distanceHtml = (userLat && userLng && station.distance) ? 
                    `<span class="text-[11px] font-mono font-black text-emerald-400 bg-emerald-950/40 border border-emerald-500/20 px-2 py-0.5 rounded shadow-[0_0_8px_rgba(16,185,129,0.1)]">RANGE: ~${station.distance.toFixed(2)} KM</span>` : '';

                const tagsHtml = station.fuels.map(f => {
                    const isE10 = f === "E10 RON 95-V";
                    return `<span class="inline-block text-[9px] font-mono font-bold mr-1 px-1.5 py-0.5 rounded ${isE10 ? 'bg-orange-500/20 text-orange-400 border border-orange-500/40 shadow-[0_0_6px_rgba(234,88,12,0.2)]' : 'bg-slate-950 text-slate-500 border border-slate-800'}">${f}</span>`;
                }).join("");

                // Phân biệt màu thương hiệu trên giao diện list bên phải
                const brandBorderColor = station.brand === "PETROLIMEX" ? "border-l-orange-500 shadow-[0_0_10px_rgba(234,88,12,0.05)]" : "border-l-blue-500 shadow-[0_0_10px_rgba(37,99,235,0.05)]";
                const brandBadgeHtml = station.brand === "PETROLIMEX" ? 
                    `<span class="bg-orange-500/10 text-orange-400 border border-orange-500/30 text-[9px] font-mono font-bold px-1.5 py-0.5 rounded">PETROLIMEX</span>` : 
                    `<span class="bg-blue-500/10 text-blue-400 border border-blue-500/30 text-[9px] font-mono font-bold px-1.5 py-0.5 rounded">PVOIL</span>`;

                const itemDiv = document.createElement('div');
                itemDiv.className = `p-3 border border-slate-800/80 rounded-lg bg-slate-900/30 hover:bg-slate-800/50 hover:border-slate-700 transition-all duration-150 cursor-pointer border-l-4 ${brandBorderColor}`;
                itemDiv.innerHTML = `
                    <div class="flex justify-between items-start gap-2 mb-1.5">
                        <h3 class="font-bold text-slate-200 text-xs flex items-center flex-wrap gap-1.5">
                            ${brandBadgeHtml} ${idx + 1}. ${station.name}
                        </h3>
                        ${distanceHtml}
                    </div>
                    <p class="text-slate-400 text-[11px] mb-2 font-medium leading-relaxed bg-slate-950/50 p-2 rounded border border-slate-800/60">${station.address}</p>
                    <div class="flex flex-wrap gap-1">${tagsHtml}</div>
                `;

                itemDiv.addEventListener('click', () => {
                    map.setView([station.lat, station.lng], 16);
                    mapMarker.openPopup();
                });

                listContainer.appendChild(itemDiv);

                // 2. PHÂN TÁCH MÀU SẮC ICON TRÊN BẢN ĐỒ CHO TỪNG BÊN CÂY XĂNG (Neon Ring)
                const isPetro = station.brand === "PETROLIMEX";
                const stationIcon = L.divIcon({
                    className: 'station-marker-hightech',
                    html: `
                        <div class="relative flex h-5 w-5">
                            <span class="absolute inline-flex h-full w-full rounded-full ${isPetro ? 'bg-orange-500/30' : 'bg-blue-500/30'} animate-pulse"></span>
                            <span class="relative inline-flex rounded-full h-5 w-5 ${isPetro ? 'bg-orange-600 shadow-[0_0_12px_#ea580c]' : 'bg-blue-600 shadow-[0_0_12px_#2563eb]'} border-2 border-slate-900"></span>
                        </div>
                    `,
                    iconSize: [16, 16],
                    iconAnchor: [8, 8]
                });

                const mapMarker = L.marker([station.lat, station.lng], { icon: stationIcon }).addTo(markerGroup);
                mapMarker.bindPopup(`
                    <div class="font-mono text-[11px] space-y-1" style="width: 200px;">
                        <b style="color: ${isPetro ? '#f97316' : '#60a5fa'}; font-size: 12px; display: block; letter-spacing: 0.5px;">[${station.brand}] ${station.name}</b>
                        <p style="color: #94a3b8; font-weight: 500; margin: 3px 0;">${station.address}</p>
                        ${(userLat && userLng && station.distance) ? `<div style="border-top: 1px dashed #334155; padding-top: 4px; margin-top: 4px;" class="text-emerald-400 font-bold">KHOẢNG CÁCH: ~${station.distance.toFixed(2)} KM</div>` : ''}
                    </div>
                `);
            });

            if (viewBounds.length > 0) {
                map.fitBounds(viewBounds, { padding: [40, 40] });
            }
        }

        // Click chuột thẳng lên nền tối bản đồ để ghim vị trí chuẩn bằng tay
        map.on('click', function(e) {
            userLat = e.latlng.lat;
            userLng = e.latlng.lng;

            const statusEl = document.getElementById('status-message');
            statusEl.classList.remove('hidden');
            statusEl.className = "p-3 mb-4 text-xs font-mono rounded-lg border bg-slate-950/80 text-cyan-400 border-cyan-900/50 shadow-[0_0_10px_rgba(34,211,238,0.1)]";
            statusEl.innerText = `[TỌA ĐỘ ĐÃ ĐƯỢC THIẾT LẬP THỦ CÔNG KHỚP VỚI ĐIỂM CLICK CHUỘT TRÊN MẠNG BẢN ĐỒ]`;

            document.getElementById('select-district').value = "";
            document.getElementById('search-keyword').value = "";
            
            filterAndRenderStations();
        });

        document.getElementById('search-keyword').addEventListener('input', filterAndRenderStations);
        document.getElementById('select-district').addEventListener('change', filterAndRenderStations);

        document.getElementById('btn-find').addEventListener('click', () => {
            document.getElementById('select-district').value = "";
            document.getElementById('search-keyword').value = "";

            const statusEl = document.getElementById('status-message');
            statusEl.classList.remove('hidden');
            statusEl.className = "p-3 mb-4 text-xs font-mono rounded-lg border bg-slate-950/80 text-orange-400 border-orange-950";
            statusEl.innerText = "ĐANG KHỞI CHẠY HỆ THỐNG QUÉT GPS VỆ TINH TOÀN DIỆN...";

            if (!navigator.geolocation) {
                statusEl.className = "p-3 mb-4 text-xs font-mono rounded-lg border bg-red-950/80 text-red-400 border-red-900";
                statusEl.innerText = "LỖI: THIẾT BỊ KHÔNG HỖ TRỢ PHẦN CỨNG GPS.";
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    userLat = position.coords.latitude;
                    userLng = position.coords.longitude;
                    
                    statusEl.className = "p-3 mb-4 text-xs font-mono rounded-lg border bg-slate-950/80 text-emerald-400 border-emerald-950";
                    statusEl.innerText = "ĐỊNH VỊ THÀNH CÔNG. DỮ LIỆU KHOẢNG CÁCH THỰC TẾ ĐÃ ĐƯỢC ĐỒNG BỘ.";
                    
                    filterAndRenderStations();
                },
                (error) => {
                    statusEl.className = "p-3 mb-4 text-xs font-mono rounded-lg border bg-red-950/80 text-red-400 border-red-900";
                    statusEl.innerText = "TÍN HIỆU GPS PHÒNG MÁY BỊ CHẶN. VUI LÒNG CLICK THẲNG LÊN BẢN ĐỒ ĐỂ CHỌN VỊ TRÍ.";
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        });

        filterAndRenderStations();
    </script>
</body>
</html>
